databaseChangeLog:
  - changeSet:
      id: 07-create-favorites-table
      author: mustafaqasimov

      changes:
        - createTable:
            tableName: favorites
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: movie_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: active
                  type: VARCHAR(10)
                  defaultValue: 'ACTIVE'
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP


        - addForeignKeyConstraint:
            baseTableName: favorites
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_favorites_user


        - addForeignKeyConstraint:
            baseTableName: favorites
            baseColumnNames: movie_id
            referencedTableName: movies
            referencedColumnNames: id
            constraintName: fk_favorites_movie


        - addUniqueConstraint:
            tableName: favorites
            columnNames: user_id, movie_id
            constraintName: uk_favorites_user_movie